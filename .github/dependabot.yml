version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      # One PR per month for everything, instead of one per crate.
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The MSRV job pins dtolnay/rust-toolchain@1.88.0 on purpose — bumping it
      # would silently raise the minimum supported Rust version.
      - dependency-name: dtolnay/rust-toolchain
