name: Feature request
description: A new command, flag, theme or output improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out about your containers?
      description: Describe the question you are answering today with a pile of docker flags.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What should the output look like?
      description: A sketch is fine — ASCII, columns, whatever you have in mind.
      render: text
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This reads state; it does not start, stop, exec into or delete anything
        - label: I checked ROADMAP.md and this is not already listed
